name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests, debug APKs, and release bundles
        run: >-
          ./gradlew --no-daemon --stacktrace
          :engine:test
          :app:testFreeDebugUnitTest
          :app:testProDebugUnitTest
          :app:assembleFreeDebug
          :app:assembleProDebug
          :app:bundleFreeRelease
          :app:bundleProRelease
          :app:lintFreeRelease
          :app:lintProRelease

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-artifacts
          if-no-files-found: error
          path: |
            app/build/outputs/apk/free/debug/*.apk
            app/build/outputs/apk/pro/debug/*.apk
            app/build/outputs/bundle/freeRelease/*.aab
            app/build/outputs/bundle/proRelease/*.aab
