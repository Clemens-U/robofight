# Opcode Arena — Gradle build properties
#
# AGP 9.0+ ships built-in Kotlin and removes support for org.jetbrains.kotlin.android,
# so we rely on the built-in Kotlin for the app and a plain kotlin("jvm") for the engine.
# Leave android.builtInKotlin at its default (true). Do NOT set android.newDsl=false.

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
