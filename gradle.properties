# Opcode Arena — Gradle build properties
#
# AGP 9.0+ ships built-in Kotlin and removes support for org.jetbrains.kotlin.android,
# so we rely on the built-in Kotlin for the app and a plain kotlin("jvm") for the engine.
# Leave android.builtInKotlin at its default (true). Do NOT set android.newDsl=false.

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# W1 (docs/FIRELINE-WEB.md §9, gradle/wasm-toolchain.gradle): the Kotlin/Wasm targets use
# yarn as their package manager by default. This machine has no yarn, and the plugin's own
# yarn download is unreachable through the curated Maven mirror, so yarn is switched off and
# npm (bundled with the Node.js on PATH, v22 here) is used instead. Both web modules declare
# no npm dependencies of their own.
kotlin.js.yarn=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
